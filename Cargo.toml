[workspace]
members = [
  "bubblegum",
  "blockbuster",
  "core",
  "das_api",
  "digital_asset_types",
  "integration_tests",
  "metaplex-rpc-proxy",
  "metadata_json",
  "migration",
  "nft_ingester",
  "ops",
  "grpc-ingest",
  "program_transformers",
  "tools/acc_forwarder",
  "tools/bgtask_creator",
  "tools/fetch_trees",
  "tools/load_generation",
  "tools/tree-status",
  "tools/txn_forwarder",
]
resolver = "2"

[workspace.package]
edition = "2021"
publish = false
repository = "https://github.com/metaplex-foundation/digital-asset-rpc-infrastructure"
version = "0.7.2"

[workspace.dependencies]
das-metadata-json = { path = "metadata_json" }
digital_asset_types = { path = "digital_asset_types" }
das-ops = { path = "ops" }
anchor-client = "1.0.0"
anchor-lang = "1.0.0"
anyhow = "1.0.75"
async-std = "1.0.0"
async-stream = "0.3.5"
async-trait = "0.1.60"
atty = "0.2.14"
backon = "0.4.1"
blockbuster = { path = "blockbuster" }
borsh = { version = "1.5", features = ["derive"] }
bs58 = "0.4.0"
bytemuck = { version = "1.14.0", features = ["derive"] }
cadence = "0.29.0"
cadence-macros = "0.29.0"
cargo-lock = "11.0.1"
chrono = "0.4.19"
clap = "4.2.2"
das-core = { path = "core" }
das-bubblegum = { path = "bubblegum" }
das_api = { path = "das_api" }
derive_more = { version = "0.99.17" }
enum-iterator = "1.2.0"
enum-iterator-derive = "1.1.0"
env_logger = "0.10.0"
fake = "2.5.0"
figment = "0.10.8"
flatbuffers = "23.1.21"
function_name = "0.3.0"
futures = "0.3.28"
git-version = "0.3.5"
heck = "0.5.0"
hex = "0.4.3"
hyper = { version = "1.6.0", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
http-body-util = "0.1.3"
indexmap = "1.9.3"
indicatif = "0.17.5"
insta = "1.34.0"
itertools = "0.10.1"
json5 = "0.4.1"
jsonpath_lib = "0.3.0"
jsonrpsee = "0.16.2"
jsonrpsee-core = "0.16.2"
lazy_static = "1.4.0"
log = "0.4.17"
lru = "0.12.3"
metrics = "0.20.1"
migration = { path = "migration" }
mime_guess = "2.0.4"
mpl-bubblegum = "3.0.0"
mpl-account-compression = { version = "2.0.0", features = ["no-entrypoint", "cpi"] }
mpl-core = { version = "0.12.0", features = ["serde"] }
mpl-noop = { version = "2.0.0", features = ["no-entrypoint"] }
mpl-token-metadata = "5.1.2-alpha.2"
nft_ingester = { path = "nft_ingester" }
num-derive = "0.3.3"
num-traits = "0.2.15"
once_cell = "1.19.0"
open-rpc-derive = "0.0.4"
open-rpc-schema = "0.0.4"
opentelemetry = { version = "0.30.0", features = ["trace"] }
opentelemetry-jaeger = "0.20.0"
opentelemetry_sdk = { version = "0.30.0", features = ["trace"] }
plerkle_messenger = "1.6.0"
plerkle_serialization = "3.0.0"
program_transformers = { path = "program_transformers" }
prometheus = { version = "0.14.0", features = ["push"] }
proxy-wasm = "0.2.0"
rand = "0.8.5"
redis = "0.25.3"
regex = "1.6.0"
reqwest = {version = "0.11.13", features = ["stream"]}
rust-crypto = "0.2.36"
schemars = "0.8.6"
schemars_derive = "0.8.6"
sea-orm = { version = "0.10.6", features = ["mock"] }
sea-orm-migration = "0.10.6"
sea-query = "0.28.1"
serde = "1.0.137"
serde_json = "1.0.81"
serde_yaml = "0.9.34"
serial_test = "2.0.0"
solana-account-decoder = "3.0.0"
solana-client = "3.0.0"
solana-commitment-config = "3.0.0"
solana-message = "3.0.0"
solana-system-interface = "3.0.0"
agave-geyser-plugin-interface = "3.0.0"
solana-program = "3.0.0"
solana-sdk = "3.0.0"
solana-transaction-status = "3.0.0"
spl-associated-token-account = { version = "8.0.0", features = ["no-entrypoint"] }
spl-concurrent-merkle-tree = "0.3.0"
spl-pod = { version = "0.7.2", features = ["serde-traits"] }
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "10.0.0", features = ["no-entrypoint"] }
spl-token-group-interface = "=0.7.1"
spl-token-metadata-interface = "0.8.0"
sha3 = "0.10.8"
sqlx = "0.6.3"
stretto = "0.8.4"
thiserror = "1.0.31"
tokio = "1.44.0"
tokio-stream = "0.1.14"
tower = "0.4.13"
tower-http = "0.3.5"
http = "0.2.2"
tracing = "0.1.40"
tracing-opentelemetry = "0.31.0"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
txn_forwarder = { path = "tools/txn_forwarder" }
url = "2.3.1"
vergen = "8.2.1"
wasi = "0.7.0"
wasm-bindgen = "0.2.83"
opentelemetry-otlp = "0.30.0"
pin-project = "1.1.10"
solana-accounts-db = "3.0.0"
solana-hard-forks = "3.0.0"
solana-runtime = "3.0.0"
solana-stake-interface = "2.0"
yellowstone-grpc-client = { version = "9", default-features = false }
yellowstone-grpc-proto = { version = "9", default-features = false }
zstd = "0.13"
tar = "0.4"
bincode = "1.3"


[workspace.lints.clippy]
clone_on_ref_ptr = "deny"
missing_const_for_fn = "deny"
trivially_copy_pass_by_ref = "deny"

[profile.release]
codegen-units = 1
lto = true
