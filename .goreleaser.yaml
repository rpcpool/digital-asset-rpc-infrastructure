# .goreleaser.yaml for rpcpool/digital-asset-rpc-infrastructure
#
# This file must be committed to the root of the digital-asset-rpc-infrastructure source
# repo. GCS upload, cosigning, and GitHub Release publishing are injected via
# ci/goreleaser-patch.yaml in Binaries-ci at build time.
#
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

before:
  hooks:
    - sh -c "git rev-parse --short HEAD > short-commit-hash.txt"

builds:
  - id: das_api
    builder: rust
    binary: das_api
    targets:
      - x86_64-unknown-linux-gnu
    flags:
      - --release
      - --bin=das_api
    env:
      - OPENSSL_INCLUDE_DIR=/usr/include
      - OPENSSL_LIB_DIR=/usr/lib/x86_64-linux-gnu

  - id: migration
    builder: rust
    binary: migration
    targets:
      - x86_64-unknown-linux-gnu
    flags:
      - --release
      - --bin=migration
    env:
      - OPENSSL_INCLUDE_DIR=/usr/include
      - OPENSSL_LIB_DIR=/usr/lib/x86_64-linux-gnu

  - id: das-ops
    builder: rust
    binary: das-ops
    targets:
      - x86_64-unknown-linux-gnu
    flags:
      - --release
      - --bin=das-ops
    env:
      - OPENSSL_INCLUDE_DIR=/usr/include
      - OPENSSL_LIB_DIR=/usr/lib/x86_64-linux-gnu

  - id: nft_ingester
    builder: rust
    binary: nft_ingester
    targets:
      - x86_64-unknown-linux-gnu
    flags:
      - --release
      - --bin=nft_ingester
    env:
      - OPENSSL_INCLUDE_DIR=/usr/include
      - OPENSSL_LIB_DIR=/usr/lib/x86_64-linux-gnu

archives:
  - formats: [binary]
    name_template: >-
      {{ .Binary }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

extra_files:
  - glob: init.sql
  - glob: short-commit-hash.txt

release:
  github:
    owner: rpcpool
    name: digital-asset-rpc-infrastructure
  draft: true
  header: |
    rust {{ .Env.RUST_VERSION }}

changelog:
  sort: asc
  use: github
